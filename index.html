<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0c11" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Davi Braga — Business Analyst</title>
    <meta name="description" content="Davi Braga · Business Analyst, Core Limit Policies no Nubank. Um apartamento 3D que é o meu currículo." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@500;700;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage">
      <canvas id="view" role="img" aria-label="Apartamento 3D em massinha: Davi na mesa de trabalho, o cachorro Banguela e seis cômodos que contam o currículo."></canvas>
      <div id="tour" aria-hidden="true"><div class="track"></div></div>
      <div id="scrim" aria-hidden="true"></div>
      <div id="grain" aria-hidden="true"></div>
      <div id="vignette" aria-hidden="true"></div>
      <div id="fade" aria-hidden="true"></div>

      <header id="brand">
        <span class="mark"></span>
        <span>Davi Braga</span>
        <em>Business Analyst · Nubank</em>
      </header>

      <main id="main">
        <section id="slide" aria-live="polite"></section>
      </main>

      <nav id="rail" aria-label="seções"></nav>

      <footer id="bar">
        <div id="counter"><span class="roll"><b>01</b></span><span>/ 06</span></div>
        <p class="hint desk"><kbd>←</kbd><kbd>→</kbd> ou scroll · <kbd>M</kbd> sumário · <kbd>C</kbd> e-mail · clica nas coisas</p>
        <p class="hint mob">desliza · toca no 3D e nos chips</p>
        <div class="tools">
          <button id="open-index" type="button">Sumário</button>
          <button id="sound" type="button" aria-label="som" aria-pressed="false"><i></i><i></i><i></i><i></i></button>
        </div>
        <div id="progress" aria-hidden="true"><i></i></div>
      </footer>

      <button id="unfocus" type="button">← voltar <kbd class="desk">esc</kbd></button>
      <div id="tip" aria-hidden="true"></div>
      <div id="toast" role="status"></div>

      <div id="dossier">
        <aside id="dossier-sheet" role="dialog" aria-modal="true" aria-label="detalhes">
          <button id="dossier-close" type="button">fechar <kbd class="desk">esc</kbd></button>
          <div id="dossier-body"></div>
        </aside>
      </div>

      <div id="intro">
        <p class="sub">Business Analyst · Core Limit Policies · Nubank</p>
        <h1><span>Davi</span><span>Braga</span></h1>
        <p class="sub">Um apartamento que é o meu currículo. Entra.</p>
        <button class="cta" type="button">entrar <i class="desk">↵</i></button>
        <div class="load" role="progressbar" aria-label="carregando o 3D" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="load-bar"><i></i></div>
          <p><b class="load-n">00</b><span class="load-t">carregando</span></p>
        </div>
      </div>
    </div>
    <noscript>
      <p class="nojs">Este currículo em 3D precisa de JavaScript. Davi Braga · Business Analyst no Nubank · <a href="https://www.linkedin.com/in/davibragamor/">LinkedIn</a></p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
